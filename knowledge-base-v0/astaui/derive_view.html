<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow</title>
<style>
/*__ASTA__*/
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { min-height: 100vh; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: var(--spacing-xs);
  padding: var(--spacing-2xs) var(--spacing-2xl); background: var(--surface-pane); border-bottom: 1px solid var(--stroke); }
.top h1 { font-size: var(--text-body-md); margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .count { color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.top .saved { color: var(--text-faint); white-space: nowrap; margin-left: auto; font-size: var(--text-body-xs); }
.top .saved.bad { color: var(--danger); white-space: normal; }
.top .saved button { appearance: none; border: 0; background: none; color: var(--color-link); font: inherit; padding: 0 0 0 6px; cursor: pointer; text-decoration: underline; }
.top .get { display: flex; gap: 6px; align-items: center; }
.top .get [hidden] { display: none; }
main { max-width: 60rem; margin: 0 auto; padding: var(--spacing-3xl) var(--spacing-2xl) 6rem; }
.lede { color: var(--text-muted); max-width: 44rem; margin: 0 0 var(--spacing-2xs); font-size: var(--text-body-md); line-height: var(--leading-body-md); }
.facts { color: var(--text-faint); margin: 0 0 var(--spacing-md); font-size: var(--text-body-xs); }
.show { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-xs); margin: 0 0 var(--spacing-xs); color: var(--text-muted); }
.show .gap { flex: 1; }
.sum { margin: 0 0 var(--spacing-3xl); color: var(--text-muted); font-size: var(--text-body-sm); }
.sum[hidden] { display: none; }
section { margin: 0 0 var(--spacing-5xl); }
section > h2 { font-size: var(--text-heading-sm); line-height: var(--leading-heading-sm); margin: 0 0 4px; }
section > .how { color: var(--text-muted); margin: 0 0 var(--spacing-md); max-width: 44rem; }
.sec-head { display: flex; align-items: baseline; gap: var(--spacing-xs); }
.sec-head h2 { font-size: var(--text-heading-sm); line-height: var(--leading-heading-sm); margin: 0 0 4px; }
.sec-head .gap { flex: 1; }

/* A part: what was written on the left, the person's rating on the right. */
.node { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px var(--spacing-md); align-items: start;
  padding: var(--spacing-xs) 0; border-top: 1px solid var(--stroke); border-radius: var(--radius-3xs); transition: box-shadow .3s ease; }
.node[data-hide], .part[data-hide] { display: none; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0; min-height: 24px; }
.kind { color: var(--text-faint); font-size: var(--text-body-xs); text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.gen { font-weight: 600; }
.spec { color: var(--text-muted); margin-top: 2px; }
[contenteditable] { border-radius: var(--radius-3xs); outline: 0; padding: 0 2px; margin: 0 -2px; }
[contenteditable]:hover { background: var(--surface); }
[contenteditable]:focus-visible, [contenteditable]:focus { background: var(--surface-field); box-shadow: 0 0 0 2px var(--focus-ring); }
[contenteditable]:empty::before { content: attr(data-placeholder); color: var(--text-faint); font-weight: 400; }
.tags { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 2px; }
.tag { display: inline-block; padding: 0 6px; border-radius: var(--radius-3xs); background: var(--surface-strong);
  color: var(--text-muted); font-size: var(--text-body-xs); font-weight: 500; }
/* What the person changed is marked in one colour, wherever it is. */
.tag.chg { background: color-mix(in srgb, var(--caution) 16%, transparent); color: var(--color-text); }
.was { margin-top: 2px; color: var(--text-faint); font-size: var(--text-body-xs); }
.was[hidden] { display: none; }
.was s { color: var(--text-muted); }
.node.out .gen, .node.out .spec { text-decoration: line-through; color: var(--text-faint); }
.node.just { box-shadow: 0 0 0 2px var(--focus-ring); }
.differs { margin-top: 4px; color: var(--text-muted); font-size: var(--text-body-sm); }
.differs::before { content: "The sources differ: "; color: var(--text-faint); }
.ev { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--spacing-2xs); align-items: center; }
.ev .shot { appearance: none; padding: 0; border: 1px solid var(--stroke); border-radius: var(--radius-3xs); background: var(--surface);
  cursor: zoom-in; width: 104px; height: 65px; overflow: hidden; }
.ev img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
.ev .ref { appearance: none; border: 1px solid var(--stroke); background: var(--surface); color: var(--color-text); cursor: pointer;
  font: 12px/1.6 var(--font-mono); padding: 2px 8px; border-radius: var(--radius-3xs); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .ref:hover { background: var(--surface-strong); }
details.acts { margin-top: 6px; color: var(--text-muted); font-size: var(--text-body-xs); }
details.acts summary { cursor: pointer; width: max-content; }
details.acts ol { margin: 4px 0 0; padding-left: 1.4em; }
details.acts .x { font-size: var(--text-body-xs); }

/* The features a task uses, and the tasks a feature serves. */
.uses { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 6px; }
.uses-k { color: var(--text-faint); font-size: var(--text-body-xs); margin-right: 2px; }
.fref { appearance: none; border: 1px solid var(--stroke); background: var(--surface); color: var(--color-text); cursor: pointer;
  font: 500 12px/1.5 var(--font-body-sm); padding: 1px 8px; border-radius: var(--radius-3xs); max-width: 22rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fref b { font-family: var(--font-mono); font-weight: 600; color: var(--text-muted); margin-right: 4px; }
.fref:hover, .fref:focus-visible { background: var(--surface-strong); }
.fref:focus-visible { outline: 0; box-shadow: 0 0 0 2px var(--focus-ring); }
.tip { position: absolute; z-index: 20; width: min(22rem, calc(100vw - 24px)); padding: var(--spacing-xs) var(--spacing-sm);
  background: var(--surface-raised); color: var(--color-text); border: 1px solid var(--stroke); border-radius: var(--radius-xs); pointer-events: none; }
.tip[hidden] { display: none; }
.tip h3 { margin: 0 0 4px; font-size: var(--text-body-sm); font-weight: 600; }
.tip h3 b { font-family: var(--font-mono); color: var(--text-muted); margin-right: 6px; }
.tip p { margin: 0 0 6px; color: var(--text-muted); font-size: var(--text-body-sm); }
.tip img { display: block; width: 100%; max-height: 11rem; object-fit: cover; object-position: top left; border-radius: var(--radius-3xs); border: 1px solid var(--stroke); margin-bottom: 6px; }
.tip ol { margin: 0 0 6px; padding-left: 1.3em; color: var(--text-muted); font-size: var(--text-body-xs); }
.tip .hint { color: var(--text-faint); font-size: var(--text-body-xs); margin: 0; }

/* Rating a part. */
.check { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.check .row { display: flex; gap: 6px; align-items: center; }
.asta-segmented.small > button { padding: 4px 10px; font-size: 12px; }
.note { width: 18rem; max-width: 100%; height: 32px; padding: 0 var(--spacing-2xs); font-size: var(--text-body-sm);
  background: var(--surface-field); color: var(--color-text); border-radius: var(--radius-3xs); }
.note[hidden] { display: none; }
.x { appearance: none; border: 0; background: none; color: var(--text-faint); cursor: pointer; font: inherit; padding: 2px 6px; border-radius: var(--radius-3xs); }
.x:hover { background: var(--surface-strong); color: var(--color-text); }

/* Folding a phase or a feature, and the grip a phase or task is dragged by. */
.fold { appearance: none; border: 0; background: none; color: var(--text-muted); cursor: pointer; font: inherit; flex: none;
  width: 22px; height: 22px; margin: 0 4px 0 0; border-radius: var(--radius-3xs); display: inline-grid; place-items: center; }
.fold:hover { background: var(--surface-strong); color: var(--color-text); }
.fold::before { content: ""; width: 7px; height: 7px; border: solid currentColor; border-width: 0 1.5px 1.5px 0;
  transform: translateY(-2px) rotate(45deg); transition: transform .15s ease; }
.fold[aria-expanded="false"]::before { transform: translateX(-1px) rotate(-45deg); }
.grip { appearance: none; border: 0; background: none; color: var(--text-faint); cursor: grab; flex: none; touch-action: none;
  width: 18px; height: 24px; margin: 0 2px 0 -6px; padding: 0; border-radius: var(--radius-3xs); display: inline-grid; place-items: center; }
.grip:hover { background: var(--surface-strong); color: var(--color-text); }
.grip:focus-visible { outline: 0; box-shadow: 0 0 0 2px var(--focus-ring); color: var(--color-text); }
.grip svg { display: block; fill: currentColor; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
.part.lifted { opacity: .4; }
.drop { position: absolute; z-index: 15; height: 2px; border-radius: 1px; background: var(--focus-ring); pointer-events: none; }
.drop[hidden] { display: none; }
.ghost { position: fixed; z-index: 30; pointer-events: none; max-width: 20rem; padding: 4px 10px; border-radius: var(--radius-3xs);
  background: var(--surface-raised); border: 1px solid var(--stroke); font-size: var(--text-body-sm); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ghost[hidden] { display: none; }

.folded { color: var(--text-faint); font-size: var(--text-body-xs); margin-left: 6px; }
.phase:not(.closed) > .node .folded { display: none; }
.part.phase.closed > .kids { display: none; }
.part.phase.closed > .node :is(.spec, .ev, .acts, .differs, .uses, .was) { display: none; }
.feat.closed .more { display: none; }

/* A phase is a pane; what is inside it is indented under its head. */
.part.phase { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--radius-xs); padding: var(--spacing-2xs) var(--spacing-md) var(--spacing-xs); margin-bottom: var(--spacing-xs); }
.part.phase > .node { border-top: 0; }
.part.phase.closed { padding-bottom: var(--spacing-2xs); }
.kids { padding-left: var(--spacing-xl); border-left: 1px solid var(--stroke); margin-left: 2px; }
.goal { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--radius-xs); padding: var(--spacing-2xs) var(--spacing-md); }
.goal .node { border-top: 0; }
.about { margin: 0 0 var(--spacing-xs); display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: 4px var(--spacing-md); }
.about dt { color: var(--text-faint); font-size: var(--text-body-xs); padding-top: 3px; }
.about dd { margin: 0; }
.adds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--spacing-2xs); }

.feat .steps { margin: 6px 0 0; padding-left: 1.4em; color: var(--text-muted); }
.list { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--radius-xs); padding: var(--spacing-2xs) var(--spacing-md); }
.list > .node:first-child { border-top: 0; }
.list > p { margin: 0; padding: var(--spacing-2xs) 0; border-top: 1px solid var(--stroke); }
.list > p:first-child { border-top: 0; }
.empty { color: var(--text-faint); padding: var(--spacing-2xs) 0; }
.where { color: var(--text-muted); }
.where code { font-size: 12px; word-break: break-all; }
.err { color: var(--danger); }

/* The survey: a 1 to 5 scale per question, each point named. */
.q { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--radius-xs); padding: var(--spacing-xs) var(--spacing-md) var(--spacing-md); margin-bottom: var(--spacing-xs); }
.q-t { margin: 0 0 var(--spacing-xs); font-weight: 600; max-width: 44rem; }
.q-t .n { color: var(--text-faint); font-variant-numeric: tabular-nums; margin-right: 6px; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; max-width: 40rem; }
.scale button { appearance: none; border: 1px solid var(--stroke); background: var(--surface-field); color: var(--color-text); cursor: pointer;
  border-radius: var(--radius-3xs); padding: 6px 4px; display: grid; gap: 2px; justify-items: center; font: inherit; min-height: 52px; }
.scale button:hover { background: var(--surface-strong); }
.scale button:focus-visible { outline: 0; box-shadow: 0 0 0 2px var(--focus-ring); }
.scale .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.scale .w { font-size: var(--text-body-xs); color: var(--text-muted); text-align: center; line-height: 1.25; }
.scale button[aria-checked="true"] { background: var(--color-interactive-primary); border-color: var(--color-interactive-primary); color: var(--color-extra-dark-teal); }
.scale button[aria-checked="true"] .w { color: var(--color-extra-dark-teal); }
textarea.long { width: 100%; min-height: 10rem; padding: var(--spacing-2xs) var(--spacing-xs); resize: vertical; height: auto;
  background: var(--surface-field); color: var(--color-text); border-radius: var(--radius-3xs); font: inherit; line-height: var(--leading-body-md); }

dialog { border: 1px solid var(--stroke); border-radius: var(--radius-xs); padding: var(--spacing-md); background: var(--surface-raised); color: var(--color-text);
  max-width: min(96vw, 1320px); }
dialog::backdrop { background: color-mix(in srgb, var(--color-off-black) 60%, transparent); }
dialog img { display: block; max-width: 100%; max-height: 78vh; border-radius: var(--radius-3xs); }
dialog .cap { display: flex; justify-content: space-between; gap: var(--spacing-md); align-items: center; margin-top: var(--spacing-2xs); color: var(--text-muted); }
dialog pre { white-space: pre; font-size: 12px; max-height: 70vh; overflow: auto; margin: 0; min-width: min(80vw, 56rem); }
dialog pre .ln { color: var(--text-faint); user-select: none; display: inline-block; min-width: 3.5em; }
dialog pre > div { width: max-content; min-width: 100%; }
dialog pre .hit { background: var(--surface-strong); }

/* Sending the rated workflow: what goes, then Cancel or Send. */
dialog.send { width: min(94vw, 34rem); }
dialog.send h2 { font-size: var(--text-heading-sm); line-height: var(--leading-heading-sm); margin: 0 0 var(--spacing-2xs); }
dialog.send p { margin: 0 0 var(--spacing-xs); color: var(--text-muted); }
dialog.send ul { margin: 0 0 var(--spacing-xs); padding-left: 1.2em; color: var(--color-text); }
dialog.send li { margin: 2px 0; }
dialog.send .warn { color: var(--color-text); background: color-mix(in srgb, var(--caution) 14%, transparent); border-radius: var(--radius-3xs); padding: 6px 10px; }
dialog.send .warn[hidden] { display: none; }
dialog.send label { display: block; font-size: var(--text-body-xs); color: var(--text-muted); margin: var(--spacing-xs) 0 4px; }
dialog.send input { width: 100%; height: 36px; padding: 0 var(--spacing-2xs); background: var(--surface-field); color: var(--color-text);
  border-radius: var(--radius-3xs); font: inherit; }
dialog.send .said { min-height: 1.4em; margin: var(--spacing-xs) 0 0; }
dialog.send .said.bad { color: var(--danger); }
dialog.send .cap { justify-content: flex-end; margin-top: var(--spacing-md); }

@media (max-width: 640px) {
  .top { position: static; padding: var(--spacing-2xs) var(--spacing-md); flex-wrap: wrap; }
  .top .saved { margin-left: 0; }
  main { padding: var(--spacing-2xl) var(--spacing-md) 5rem; }
  .node { grid-template-columns: 1fr; }
  .check { align-items: flex-start; }
  .kids { padding-left: var(--spacing-xs); }
  .part.phase { padding: var(--spacing-2xs) var(--spacing-xs); }
  .about { grid-template-columns: 1fr; }
  .about dt { padding-top: 0; }
  .top .get { flex-wrap: wrap; }
  .scale { gap: 4px; }
  .show .asta-segmented { flex-wrap: wrap; border-radius: var(--radius-xs); }
  .show .asta-segmented > button { white-space: nowrap; }
  .scale .w { font-size: 10px; }
}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Workflow</h1>
  <span class="count" id="count"></span>
  <span class="saved" id="saved"></span>
  <span class="get">
    <button type="button" id="send" class="asta-button asta-button-primary asta-button-size-sm" hidden>Send to the AstaUI team</button>
    <a class="asta-button asta-button-default-outlined asta-button-size-sm" href="workflow.json" download>JSON</a>
    <a class="asta-button asta-button-default-outlined asta-button-size-sm" href="workflow.md" download>Outline</a>
  </span>
</header>
<main id="main">
  <p class="lede">Loading the workflow…</p>
</main>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="drop" id="drop" hidden></div>
<div class="ghost" id="ghost" hidden></div>
<dialog id="shot"><img alt=""><div class="cap"><span></span><button class="asta-button asta-button-default-outlined asta-button-size-sm">Close</button></div></dialog>
<dialog id="sendbox" class="send" aria-labelledby="send-h">
  <h2 id="send-h">Send this workflow to the AstaUI team?</h2>
  <p>The team gets the workflow as it is on this page:</p>
  <ul id="send-list"></ul>
  <p class="warn" id="send-warn" hidden></p>
  <label for="send-name">Your name, as the team will see it</label>
  <input id="send-name" autocomplete="name" placeholder="Leave empty to send without a name">
  <p class="said" id="send-said" role="status"></p>
  <div class="cap"><button type="button" class="asta-button asta-button-default-outlined asta-button-size-sm" id="send-no">Cancel</button>
    <button type="button" class="asta-button asta-button-primary asta-button-size-sm" id="send-go">Send</button></div>
</dialog>
<dialog id="code"><pre></pre><div class="cap"><span></span><button class="asta-button asta-button-default-outlined asta-button-size-sm">Close</button></div></dialog>
<script>
(() => {
  const $ = (sel, el = document) => el.querySelector(sel);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
    return el;
  };

  let data, wf, saveTimer, filter = 'all', removed = null;
  // Which phases and features are open: how the page is looked at, so it stays in
  // this browser. Everything starts folded.
  let open = new Set(), openFeat = new Set();
  const key = (what) => `derive-${what}:${data?.folder || ''}`;
  const keepOpen = () => { try {
    localStorage.setItem(key('open'), JSON.stringify([...open]));
    localStorage.setItem(key('feat-open'), JSON.stringify([...openFeat]));
  } catch (e) { /* private window */ } };
  const SAID = { ui: 'Seen in use', code: 'In the code', person: 'Added by you' };
  const newId = () => 'p' + Math.random().toString(36).slice(2, 9);
  const norm = (s) => String(s || '').replace(/\s+/g, ' ').trim();
  const peers = (n) => (n.children || []).filter((c) => c.kind !== 'action');
  const mine = (n) => { const f = n.from || []; return f.length === 1 && f[0] === 'person'; };
  const plural = (k, one, many) => `${k} ${k === 1 ? one : many}`;

  // The survey. derive.py keeps the same questions for the outline.
  const SURVEY = [
    ['match', 'How closely does this workflow match the one you meant the interface to support?',
      ['Not at all', 'Slightly', 'Somewhat', 'Closely', 'Exactly']],
    ['tasks', 'How much of the work the interface supports do the phases and tasks cover?',
      ['None of it', 'A little', 'About half', 'Most of it', 'All of it']],
    ['features', 'How many of the interface’s features does the feature list include?',
      ['None', 'A few', 'About half', 'Most', 'All']],
  ];

  // Where each phase and task sits, rebuilt with every drawing: id -> { n, list, parent }.
  let where = new Map();
  // The drawn row of each part, so typing can update its marks without redrawing.
  let rows = new Map();
  let labels = new Map();

  // -- what the person changed ---------------------------------------------------------------------
  // Each derived part keeps its first form in "orig" (derive.py writes it). A part is
  // moved when it left the part it was in, or when it is out of the longest run of its
  // old neighbours still in their first order; reworded when its words differ; added
  // when it has no first form. derive.py works the same out for the saved file.
  // Between runs as long, the one leaving out what the person placed by hand wins,
  // so a swap marks the part they moved, not its neighbour.
  function kept(seq, placed = []) {
    const n = seq.length, w = seq.map((_, i) => 100 + (placed[i] ? 0 : 1)), best = w.slice(), prev = Array(n).fill(-1);
    for (let i = 0; i < n; i++) for (let j = 0; j < i; j++) if (seq[j] < seq[i] && best[j] + w[i] > best[i]) { best[i] = best[j] + w[i]; prev[i] = j; }
    const out = new Set();
    if (!n) return out;
    let i = 0;
    for (let k = 1; k < n; k++) if (best[k] > best[i]) i = k;
    while (i >= 0) { out.add(i); i = prev[i]; }
    return out;
  }
  function changeMap() {
    const m = new Map();
    const get = (id) => { if (!m.has(id)) m.set(id, {}); return m.get(id); };
    const words = (n, keys) => {
      if (!n.orig) return;
      for (const k of keys) if (norm(n[k]) !== (n.orig[k] || '')) get(n.id)[k] = n.orig[k] || '';
    };
    const walk = (n) => {
      const kids = peers(n);
      const pid = n.id || 'g';
      const stay = kids.filter((c) => c.orig && c.orig.in === pid);
      const still = kept(stay.map((c) => c.orig.i ?? 0), stay.map((c) => !!c.placed));
      for (const c of kids) {
        if (!c.orig) get(c.id).added = true;
        else {
          if (!still.has(stay.indexOf(c))) get(c.id).moved = c.orig.at || '?';
          words(c, ['general', 'specific']);
        }
        walk(c);
      }
    };
    if (wf.tree) { words(wf.tree, ['general', 'specific']); walk(wf.tree); }
    for (const f of wf.features || []) {
      if (!f.orig) get(f.id).added = true;
      else words(f, ['name', 'general']);
    }
    return m;
  }
  const changed = (c) => !!c && (c.added || c.moved || 'general' in c || 'specific' in c || 'name' in c);

  // -- evidence: screenshots and code ------------------------------------------------------------
  function openShot(src, caption) {
    const d = $('#shot');
    $('img', d).src = src;
    $('img', d).alt = caption;
    $('.cap span', d).textContent = `${caption} · ${src}`;
    d.showModal();
  }
  async function openCode(ref) {
    const d = $('#code');
    const pre = $('pre', d);
    pre.textContent = 'Loading…';
    $('.cap span', d).textContent = ref;
    d.showModal();
    const r = await fetch('code?ref=' + encodeURIComponent(ref)).then((x) => x.json()).catch((e) => ({ error: e.message }));
    if (r.error) { pre.textContent = `These lines could not be shown: ${r.error}.`; return; }
    pre.replaceChildren(...r.lines.map((line, i) => {
      const n = r.first + i;
      return h('div', { class: n >= r.from && n <= r.to ? 'hit' : null }, h('span', { class: 'ln' }, n), line || ' ');
    }));
    $('.cap span', d).textContent = `${r.path}, lines ${r.from}–${r.to} of ${r.of}`;
    const hit = $('.hit', pre);
    if (hit) hit.scrollIntoView({ block: 'center' });
  }
  for (const id of ['shot', 'code']) {
    $(`#${id} button`).addEventListener('click', () => $('#' + id).close());
    $('#' + id).addEventListener('click', (e) => { if (e.target.id === id) e.target.close(); });
  }
  const shotsOf = (n) => (n.screens || []).filter((s) => typeof s === 'string' && s.startsWith('screens/'));

  function evidence(n, caption) {
    const shots = shotsOf(n);
    const refs = (n.code || []).filter((s) => typeof s === 'string');
    if (!shots.length && !refs.length) return null;
    return h('div', { class: 'ev' },
      shots.map((s) => h('button', { type: 'button', class: 'shot', title: `Open ${s}`, onclick: () => openShot(s, caption) },
        h('img', { src: s, alt: `${caption} (${s})`, loading: 'lazy', onerror: (e) => e.target.parentElement.remove() }))),
      refs.map((ref) => h('button', { type: 'button', class: 'ref', title: `Show ${ref}`, onclick: () => openCode(ref) }, ref)));
  }

  // -- editing -----------------------------------------------------------------------------------
  function editable(n, key, cls, placeholder) {
    const el = h('div', { class: cls, contenteditable: 'plaintext-only', spellcheck: 'true', 'data-placeholder': placeholder,
      role: 'textbox', 'aria-label': placeholder }, n[key] || '');
    el.addEventListener('input', () => { n[key] = norm(el.textContent); save(); remark(n.id); });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
    return el;
  }

  function tagKids(n, c = {}) {
    const f = n.from || [];
    const out = [];
    if (n.branch) out.push(h('span', { class: 'tag' }, n.branch));
    if (f.includes('ui') && f.includes('code')) out.push(h('span', { class: 'tag' }, 'Seen in use and in the code'));
    else for (const x of f) out.push(h('span', { class: x === 'person' ? 'tag chg' : 'tag' }, SAID[x] || x));
    if (c.added && !f.includes('person')) out.push(h('span', { class: 'tag chg' }, 'Added by you'));
    if (c.moved) out.push(h('span', { class: 'tag chg', title: 'Where the derivation put it' },
      `Moved from ${n.kind === 'phase' ? 'phase' : 'task'} ${c.moved}`));
    if ('general' in c || 'specific' in c || 'name' in c) out.push(h('span', { class: 'tag chg' }, 'Reworded'));
    return out;
  }
  function wasLine(c, k) {
    return h('div', { class: 'was', hidden: !(k in (c || {})) }, 'Was: ', h('s', {}, (c || {})[k] || '(empty)'));
  }
  // After typing: the part's tags and "Was" lines, the summary, without a redraw.
  function remark(id) {
    const ch = changeMap();
    const r = rows.get(id);
    if (r) {
      const c = ch.get(id) || {};
      r.tags.replaceChildren(...tagKids(r.n, c));
      for (const [k, el] of Object.entries(r.was)) {
        el.hidden = !(k in c);
        el.lastChild.textContent = c[k] || '(empty)';
      }
    }
    summary(ch);
  }

  const CHECKS = [['right', 'Right'], ['wrong', 'Needs a fix'], ['out', 'Doesn’t belong']];
  const NOTE = { wrong: 'What needs fixing', out: 'Why it doesn’t belong (if you want to say)' };
  function rateBox(n, list, row) {
    if (mine(n) && list) {
      const what = n.kind === 'phase' ? 'phase' : n.kind === 'task' ? 'task' : 'feature';
      return h('div', { class: 'check' }, h('div', { class: 'row' },
        h('button', { type: 'button', class: 'x', title: `Delete this ${what}, which you added`, onclick: () => removePart(n, list) }, 'Delete')));
    }
    const note = h('input', { class: 'note asta-input', placeholder: NOTE[n.check] || NOTE.wrong, 'aria-label': NOTE[n.check] || NOTE.wrong,
      value: n.note || '', hidden: !NOTE[n.check] });
    note.addEventListener('input', () => { n.note = note.value; if (!n.note) delete n.note; save(); });
    const seg = h('div', { class: 'asta-segmented small', role: 'group', 'aria-label': 'Rate this part' });
    for (const [value, label] of CHECKS) {
      const b = h('button', { type: 'button', 'aria-pressed': String(n.check === value) }, label);
      b.addEventListener('click', () => {
        n.check = n.check === value ? undefined : value;
        if (!n.check) delete n.check;
        for (const o of seg.children) o.setAttribute('aria-pressed', String(o === b && n.check === value));
        note.hidden = !NOTE[n.check];
        if (NOTE[n.check]) { note.placeholder = NOTE[n.check]; note.setAttribute('aria-label', NOTE[n.check]); }
        row.classList.toggle('out', n.check === 'out');
        if (n.check === 'wrong') note.focus();
        save();
        count();
        summary();
      });
      seg.append(b);
    }
    return h('div', { class: 'check' }, h('div', { class: 'row' }, seg), note);
  }

  function removePart(n, list) {
    const at = list.indexOf(n);
    if (at < 0) return;
    list.splice(at, 1);
    removed = { n, list, at };
    render();
    save(true, `Deleted “${n.name || n.general || 'a part'}”.`);
  }

  function addPart(list, kind, after) {
    const n = kind === 'feature'
      ? { id: newId(), name: '', general: '', from: ['person'] }
      : { id: newId(), kind, general: '', specific: '', from: ['person'], children: [] };
    const at = after ? list.indexOf(after) : -1;
    if (at >= 0) list.splice(at + 1, 0, n); else list.push(n);
    if (kind === 'phase') open.add(n.id);
    if (kind === 'feature') openFeat.add(n.id);
    keepOpen();
    render();
    const el = document.querySelector(`[data-id="${n.id}"] [contenteditable]`);
    if (el) el.focus();
  }

  // -- moving a phase or task: drag its grip, or arrow keys on it ----------------------------------
  const SVG = 'http://www.w3.org/2000/svg';
  function gripIcon() {
    const s = document.createElementNS(SVG, 'svg');
    s.setAttribute('width', '8'); s.setAttribute('height', '14'); s.setAttribute('viewBox', '0 0 8 14'); s.setAttribute('aria-hidden', 'true');
    for (const y of [2, 7, 12]) for (const x of [2, 6]) {
      const c = document.createElementNS(SVG, 'circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', '1.3');
      s.append(c);
    }
    return s;
  }
  function grip(n, label) {
    const what = n.kind === 'phase' ? 'phase' : 'task';
    return h('button', { type: 'button', class: 'grip', 'data-grip': n.id, title: `Drag to move this ${what}, or press the arrow keys`,
      'aria-label': `Move ${label}. Up and down arrows move it.`, onpointerdown: (e) => startDrag(e, n), onkeydown: (e) => keyMove(e, n) }, gripIcon());
  }
  function focusGrip(id) {
    const g = document.querySelector(`[data-grip="${CSS.escape(id)}"]`);
    if (g) g.focus({ preventScroll: false });
  }
  function keyMove(e, n) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    const w = where.get(n.id);
    if (!w) return;
    const p = w.list.filter((c) => c.kind !== 'action');
    const other = p[p.indexOf(n) + (e.key === 'ArrowUp' ? -1 : 1)];
    if (!other) return;
    const a = w.list.indexOf(n), b = w.list.indexOf(other);
    [w.list[a], w.list[b]] = [w.list[b], w.list[a]];
    n.placed = true;
    render();
    save();
    focusGrip(n.id);
  }

  let drag = null;
  function slotsFor(n, wrap) {
    const out = [];
    const sx = window.scrollX, sy = window.scrollY;
    const seen = (el) => el.getClientRects().length > 0;
    for (const el of document.querySelectorAll(`.part[data-kind="${n.kind}"]`)) {
      if (wrap.contains(el) || !seen(el)) continue;
      const ref = where.get(el.dataset.id);
      if (!ref) continue;
      const r = el.getBoundingClientRect();
      out.push({ y: r.top + sy - 2, x: r.left + sx, w: r.width, list: ref.list, before: ref.n });
      out.push({ y: r.bottom + sy + 2, x: r.left + sx, w: r.width, list: ref.list, after: ref.n });
    }
    // A task can also go at the end of any phase, open or folded.
    if (n.kind === 'task') {
      for (const el of document.querySelectorAll('.part.phase')) {
        if (!seen(el)) continue;
        const ref = where.get(el.dataset.id);
        if (!ref) continue;
        const closed = el.classList.contains('closed');
        const anchor = closed ? el : $(':scope > .kids > .adds', el);
        if (!anchor) continue;
        const r = anchor.getBoundingClientRect();
        out.push({ y: (closed ? r.bottom - 8 : r.top - 2) + sy, x: r.left + sx + (closed ? 28 : 0), w: r.width - (closed ? 56 : 0),
          list: ref.n.children, end: true, into: ref.n });
      }
    }
    return out;
  }
  function startDrag(e, n) {
    if (e.button !== 0 || filter !== 'all') return;
    const wrap = document.querySelector(`.part[data-id="${CSS.escape(n.id)}"]`);
    if (!wrap) return;
    e.preventDefault();
    const g = e.currentTarget;
    g.setPointerCapture(e.pointerId);
    drag = { n, wrap, g, x0: e.clientX, y0: e.clientY, y: e.clientY, started: false, pick: null, slots: [] };
    g.addEventListener('pointermove', onDrag);
    g.addEventListener('pointerup', endDrag);
    g.addEventListener('pointercancel', stopDrag);
  }
  function onDrag(e) {
    if (!drag) return;
    drag.y = e.clientY;
    if (!drag.started) {
      if (Math.abs(e.clientX - drag.x0) < 4 && Math.abs(e.clientY - drag.y0) < 4) return;
      drag.started = true;
      hideTip();
      drag.slots = slotsFor(drag.n, drag.wrap);
      drag.wrap.classList.add('lifted');
      document.body.classList.add('dragging');
      $('#ghost').textContent = drag.n.general || 'Untitled';
      $('#ghost').hidden = false;
      requestAnimationFrame(edgeScroll);
    }
    $('#ghost').style.left = `${e.clientX + 14}px`;
    $('#ghost').style.top = `${e.clientY + 10}px`;
    pick();
  }
  function pick() {
    const y = drag.y + window.scrollY;
    let best = null, d = Infinity;
    for (const s of drag.slots) { const dd = Math.abs(s.y - y); if (dd < d) { d = dd; best = s; } }
    drag.pick = best;
    const line = $('#drop');
    line.hidden = !best;
    if (best) Object.assign(line.style, { top: `${best.y - 1}px`, left: `${best.x}px`, width: `${Math.max(40, best.w)}px` });
  }
  function edgeScroll() {
    if (!drag || !drag.started) return;
    const edge = 64;
    const v = drag.y < edge ? -(edge - drag.y) / 3 : drag.y > window.innerHeight - edge ? (drag.y - window.innerHeight + edge) / 3 : 0;
    if (v) { window.scrollBy(0, v); pick(); }
    requestAnimationFrame(edgeScroll);
  }
  function stopDrag() {
    if (!drag) return;
    const { g, wrap } = drag;
    g.removeEventListener('pointermove', onDrag);
    g.removeEventListener('pointerup', endDrag);
    g.removeEventListener('pointercancel', stopDrag);
    wrap.classList.remove('lifted');
    document.body.classList.remove('dragging');
    $('#drop').hidden = true;
    $('#ghost').hidden = true;
    drag = null;
  }
  function endDrag() {
    const d = drag;
    stopDrag();
    if (!d || !d.started || !d.pick) return;
    const s = d.pick;
    const from = where.get(d.n.id).list;
    const before = JSON.stringify([from.map((c) => c.id), s.list.map((c) => c.id)]);
    from.splice(from.indexOf(d.n), 1);
    let at = s.list.length;
    if (s.before) at = s.list.indexOf(s.before);
    else if (s.after) at = s.list.indexOf(s.after) + 1;
    s.list.splice(Math.max(0, at), 0, d.n);
    if (JSON.stringify([from.map((c) => c.id), s.list.map((c) => c.id)]) === before) return;
    d.n.placed = true;
    if (s.into) { open.add(s.into.id); keepOpen(); }
    render();
    save();
    flash(d.n.id);
  }
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && drag) { e.preventDefault(); stopDrag(); } });

  function flash(id) {
    const el = document.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
    if (!el) return;
    el.classList.add('just');
    setTimeout(() => el.classList.remove('just'), 1400);
  }

  // -- the features a part uses, and the tooltip that shows one -------------------------------------
  const fLabel = (f) => `F${(wf.features || []).indexOf(f) + 1}`;
  const usesOf = (n) => (wf.features || []).filter((f) => (f.serves || []).includes(n.id));
  function tip(el, f) {
    const t = $('#tip');
    const shot = shotsOf(f)[0];
    t.replaceChildren(
      h('h3', {}, h('b', {}, fLabel(f)), f.name || 'Untitled feature'),
      f.general ? h('p', {}, f.general) : null,
      shot ? h('img', { src: shot, alt: '', onerror: (e) => e.target.remove() }) : f.steps?.length ? h('ol', {}, f.steps.slice(0, 4).map((s) => h('li', {}, s))) : null,
      h('p', { class: 'hint' }, 'Click to go to this feature'));
    t.hidden = false;
    const r = el.getBoundingClientRect();
    const w = t.offsetWidth, ht = t.offsetHeight;
    const left = Math.min(Math.max(12, r.left), window.innerWidth - w - 12) + window.scrollX;
    const below = r.bottom + 8 + ht < window.innerHeight;
    t.style.left = `${left}px`;
    t.style.top = `${(below ? r.bottom + 6 : r.top - ht - 6) + window.scrollY}px`;
  }
  function hideTip() { $('#tip').hidden = true; }
  function usesRow(n) {
    const fs = usesOf(n);
    if (!fs.length) return null;
    return h('div', { class: 'uses' }, h('span', { class: 'uses-k' }, 'Uses'),
      fs.map((f) => h('button', { type: 'button', class: 'fref', 'aria-describedby': 'tip',
        onmouseenter: (e) => tip(e.currentTarget, f), onmouseleave: hideTip,
        onfocus: (e) => tip(e.currentTarget, f), onblur: hideTip,
        onclick: () => { hideTip(); goTo(f.id, true); } }, h('b', {}, fLabel(f)), f.name || 'Untitled feature')));
  }
  // Open what a part sits in, scroll to it and show where it is.
  function goTo(id, feature) {
    if (feature) openFeat.add(id);
    else for (let w = where.get(id); w; w = w.parent && where.get(w.parent.id)) if (w.parent?.kind === 'phase') open.add(w.parent.id);
    if (filter !== 'all') filter = 'all';
    keepOpen();
    render();
    const el = document.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    flash(id);
    const target = feature ? $('.fold', el) : $('.grip', el) || $('[contenteditable]', el);
    if (target) target.focus({ preventScroll: true });
  }

  // -- drawing -----------------------------------------------------------------------------------
  const KIND = { goal: 'Goal', phase: 'Phase', task: 'Task' };
  let CH = new Map();
  const matches = (n) => {
    if (filter === 'all') return true;
    const f = n.from || [];
    if (filter === 'one') return !(f.includes('ui') && f.includes('code'));
    if (filter === 'open') return !n.check && !mine(n);
    if (filter === 'wrong') return n.check === 'wrong';
    if (filter === 'out') return n.check === 'out';
    if (filter === 'changed') return changed(CH.get(n.id));
    return true;
  };
  const anyMatch = (n) => matches(n) || peers(n).some(anyMatch);

  function nodeRow(n, label, list, parent) {
    const c = CH.get(n.id) || {};
    const acts = (n.children || []).filter((x) => x.kind === 'action');
    const isPhase = n.kind === 'phase';
    const isOpen = !isPhase || open.has(n.id) || (filter !== 'all' && peers(n).some(anyMatch));
    const inside = isPhase ? peers(n).length : 0;
    const fold = isPhase ? h('button', { type: 'button', class: 'fold', 'aria-expanded': String(isOpen),
      'aria-label': `${isOpen ? 'Fold' : 'Open'} ${label}`, title: isOpen ? 'Fold this phase' : 'Open this phase',
      onclick: () => { isOpen ? open.delete(n.id) : open.add(n.id); keepOpen(); render(); } }) : null;
    const tags = h('span', { class: 'tags' }, tagKids(n, c));
    const was = { general: wasLine(c, 'general'), specific: wasLine(c, 'specific') };
    const row = h('div', { class: 'node' + (n.check === 'out' ? ' out' : ''), 'data-id': n.id });
    row.append(h('div', {},
      h('div', { class: 'head' }, list && n.kind !== 'goal' ? grip(n, label) : null, fold, h('span', { class: 'kind' }, label), tags,
        isPhase ? h('span', { class: 'folded' }, plural(inside, 'task inside', 'tasks inside')) : null),
      editable(n, 'general', 'gen', n.kind === 'goal' ? 'The goal, in words any field could use' : 'What is done, in words any field could use'),
      was.general,
      editable(n, 'specific', 'spec', 'The same in this tool’s words'),
      was.specific,
      n.differs ? h('div', { class: 'differs' }, n.differs) : null,
      usesRow(n),
      evidence(n, n.general || ''),
      acts.length ? h('details', { class: 'acts' }, h('summary', {}, plural(acts.length, 'action', 'actions')),
        h('ol', {}, acts.map((a) => h('li', {}, a.label || a.general || '',
          ...(a.screens || []).slice(0, 1).map((s) => h('button', { type: 'button', class: 'x', onclick: () => openShot(s, a.label || '') }, 'screen')),
          ...(a.code || []).slice(0, 1).map((ref) => h('button', { type: 'button', class: 'x', onclick: () => openCode(ref) }, ref)))))) : null),
      rateBox(n, list, row));
    rows.set(n.id, { n, tags, was });
    if (list) where.set(n.id, { n, list, parent });
    labels.set(n.id, label);
    return { row, isOpen };
  }

  function part(n, path, list, parent) {
    const kids = peers(n);
    const isPhase = n.kind === 'phase';
    const label = `${isPhase ? 'Phase' : 'Task'} ${path}`;
    const { row, isOpen } = nodeRow(n, label, list, parent);
    const wrap = h('div', { class: `part ${n.kind}` + (isPhase && !isOpen ? ' closed' : ''), 'data-id': n.id, 'data-kind': n.kind,
      'data-hide': anyMatch(n) ? null : '' }, row);
    if (!matches(n)) row.setAttribute('data-hide', '');
    if (isPhase && filter !== 'all' && !matches(n) && anyMatch(n)) row.removeAttribute('data-hide');  // a phase head keeps its tasks in place
    if (isPhase || kids.length) {
      wrap.append(h('div', { class: 'kids' }, kids.map((c, i) => part(c, `${path}.${i + 1}`, n.children, n)),
        isPhase ? h('div', { class: 'adds' },
          h('button', { type: 'button', class: 'asta-button asta-button-default-outlined asta-button-size-sm',
            onclick: () => addPart(n.children, 'task') }, 'Add a task'),
          h('button', { type: 'button', class: 'asta-button asta-button-default-outlined asta-button-size-sm',
            onclick: () => addPart(list, 'phase', n) }, `Add a phase after ${path}`)) : null));
    }
    return wrap;
  }

  function featRow(f, feats) {
    const c = CH.get(f.id) || {};
    const isOpen = openFeat.has(f.id);
    const label = `Feature ${fLabel(f)}`;
    const tags = h('span', { class: 'tags' }, tagKids(f, c));
    const was = { name: wasLine(c, 'name'), general: wasLine(c, 'general') };
    const served = (f.serves || []).filter((id) => labels.has(id));
    const row = h('div', { class: 'node feat' + (isOpen ? '' : ' closed') + (f.check === 'out' ? ' out' : ''), 'data-id': f.id,
      'data-hide': matches(f) ? null : '' });
    row.append(h('div', {},
      h('div', { class: 'head' },
        h('button', { type: 'button', class: 'fold', 'aria-expanded': String(isOpen), 'aria-label': `${isOpen ? 'Fold' : 'Open'} ${label}`,
          title: isOpen ? 'Fold this feature' : 'Open this feature',
          onclick: () => { isOpen ? openFeat.delete(f.id) : openFeat.add(f.id); keepOpen(); render(); } }),
        h('span', { class: 'kind' }, label), tags),
      editable(f, 'name', 'gen', 'Its name'),
      was.name,
      h('div', { class: 'more' },
        editable(f, 'general', 'spec', 'What a person does with it, in words any field could use'),
        was.general,
        f.steps?.length ? h('ol', { class: 'steps' }, f.steps.map((s) => h('li', {}, s))) : null,
        f.differs ? h('div', { class: 'differs' }, f.differs) : null,
        served.length ? h('div', { class: 'uses' }, h('span', { class: 'uses-k' }, 'Used in'),
          served.map((id) => h('button', { type: 'button', class: 'fref', onclick: () => goTo(id, false) }, labels.get(id)))) : null,
        evidence(f, f.name || ''))),
    rateBox(f, feats, row));
    rows.set(f.id, { n: f, tags, was });
    return row;
  }

  function parts() {
    const out = [];
    const walk = (n) => { if (n.kind !== 'action') out.push(n); for (const c of n.children || []) walk(c); };
    if (wf.tree) walk(wf.tree);
    return out.concat(wf.features || []).filter((n) => !mine(n));
  }
  function tallies() {
    const all = parts();
    const t = { all: all.length, right: 0, wrong: 0, out: 0 };
    for (const n of all) if (n.check in t) t[n.check]++;
    t.rated = t.right + t.wrong + t.out;
    return t;
  }

  function count() {
    const t = tallies();
    $('#count').textContent = `${t.rated} of ${t.all} rated` + (t.wrong ? ` · ${t.wrong} need${t.wrong === 1 ? 's' : ''} a fix` : '')
      + (t.out ? ` · ${t.out} ${t.out === 1 ? 'doesn’t' : 'don’t'} belong` : '');
  }
  function changeCounts(ch = changeMap()) {
    const k = { reworded: 0, moved: 0, added: 0 };
    for (const c of ch.values()) {
      if (c.added) k.added++;
      if (c.moved) k.moved++;
      if ('general' in c || 'specific' in c || 'name' in c) k.reworded++;
    }
    return k;
  }
  function summary(ch) {
    const el = $('#sum');
    if (!el) return;
    const k = changeCounts(ch);
    const out = tallies().out;
    const bits = [];
    if (k.reworded) bits.push(`${k.reworded} reworded`);
    if (k.moved) bits.push(`${k.moved} moved`);
    if (k.added) bits.push(`${k.added} added`);
    if (out) bits.push(`${out} marked as not belonging`);
    el.hidden = !bits.length;
    el.textContent = bits.length ? `Your changes so far: ${bits.join(', ')}. Each is marked where it is, with the words it had before.` : '';
  }

  function aboutRow(label, key, placeholder) {
    const iface = (wf.interface ||= {});
    return [h('dt', {}, label), h('dd', {}, editable(iface, key, '', placeholder))];
  }

  function howMade() {
    const run = data.run || {};
    const ui = run.ui_run || {};
    const src = run.sources || {};
    const from = wf.derived_from;
    const mins = Math.max(1, Math.round((ui.seconds || 0) / 60));
    const used = `an agent using the app for ${mins} minute${mins === 1 ? '' : 's'} without seeing the code`;
    const read = run.folder ? `the code in ${run.folder}` : 'the code';
    const how = from === 'both' ? `Made from ${read} and from ${used}, then merged. Each part says where it was found.`
      : from === 'ui' ? `Made from ${used}.`
        : `Made from ${read}.`;
    const facts = [];
    if (src.code) facts.push(`from the code: ${src.code.tasks} tasks, ${src.code.features} features`);
    if (src.ui) facts.push(`from use: ${src.ui.tasks} tasks, ${src.ui.features} features`);
    if (src.ui && ui.model) facts.push(ui.model);
    if (src.ui && ui.screens != null) facts.push(`${ui.screens} screenshots`);
    if (src.ui && ui.cost_usd) facts.push(`$${ui.cost_usd.toFixed(2)}`);
    if (run.received) facts.unshift(`Sent by ${run.checked_by || 'someone who left no name'} ${new Date(run.received.sent).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}` + (run.build ? ` for build ${run.build}` : ''));
    return [h('p', { class: 'lede' }, `${how} Rate each part Right, Needs a fix or Doesn’t belong. Click any words to correct them, drag a phase or task by its grip to put it in order, and add what is missing. Every change is marked where it is and saved as you go.`),
      facts.length ? h('p', { class: 'facts' }, facts.join(' · ')) : null];
  }

  function filters() {
    const both = wf.derived_from === 'both';
    const opts = [['all', 'Everything'], ['open', 'Not rated yet'], ['wrong', 'Needs a fix'], ['out', 'Doesn’t belong'], ['changed', 'Changed by you']];
    if (both) opts.splice(1, 0, ['one', 'Found one way only']);
    const seg = h('div', { class: 'asta-segmented small', role: 'group', 'aria-label': 'Show' });
    for (const [v, label] of opts) {
      const b = h('button', { type: 'button', 'aria-pressed': String(filter === v) }, label);
      b.addEventListener('click', () => { filter = v; render(); });
      seg.append(b);
    }
    const ids = [];
    const walk = (n) => { for (const c of peers(n)) { if (c.kind === 'phase') ids.push(c.id); walk(c); } };
    if (wf.tree) walk(wf.tree);
    const allOpen = ids.length && ids.every((id) => open.has(id));
    const folds = ids.length ? h('button', { type: 'button', class: 'asta-button asta-button-default-outlined asta-button-size-sm',
      onclick: () => { open = allOpen ? new Set() : new Set(ids); keepOpen(); render(); } },
      allOpen ? 'Fold every phase' : 'Open every phase') : null;
    return [h('div', { class: 'show' }, h('span', {}, 'Show'), seg, h('span', { class: 'gap' }), folds),
      h('p', { class: 'sum', id: 'sum', role: 'status', hidden: true })];
  }

  function surveySection() {
    const s = (wf.survey ||= {});
    return h('section', { id: 'survey' },
      h('h2', {}, 'Survey questions'),
      h('p', { class: 'how' }, 'Answer about the workflow as it was first written for you, before any changes you made. 1 is the lowest and 5 the highest. Pressing a chosen answer again clears it.'),
      SURVEY.map(([k, q, words], i) => {
        const scale = h('div', { class: 'scale', role: 'radiogroup', 'aria-labelledby': `q-${k}` });
        words.forEach((w, j) => {
          const v = j + 1;
          const b = h('button', { type: 'button', role: 'radio', 'aria-checked': String(s[k] === v), 'aria-label': `${v}, ${w}` },
            h('span', { class: 'v' }, v), h('span', { class: 'w' }, w));
          b.addEventListener('click', () => {
            if (s[k] === v) delete s[k]; else s[k] = v;
            for (const o of scale.children) o.setAttribute('aria-checked', String(o === b && s[k] === v));
            save();
          });
          scale.append(b);
        });
        return h('div', { class: 'q' }, h('p', { class: 'q-t', id: `q-${k}` }, h('span', { class: 'n' }, `${i + 1}.`), q), scale);
      }));
  }

  function intendedSection() {
    const box = h('textarea', { class: 'long asta-input', id: 'intended', rows: '7', 'aria-labelledby': 'intended-h',
      placeholder: 'Describe the workflow you had in mind' });
    box.value = wf.intended_workflow || '';
    box.addEventListener('input', () => { wf.intended_workflow = box.value; if (!box.value.trim()) delete wf.intended_workflow; save(); });
    return h('section', { id: 'intended-sec' },
      h('h2', { id: 'intended-h' }, 'The workflow you intended'),
      h('p', { class: 'how' }, 'In your own words: who the interface is for, what they come to it to do, and the steps they take. Include anything the workflow above leaves out or gets wrong.'),
      box);
  }

  function render() {
    const iface = wf.interface || {};
    const name = iface.title || data.run?.title || data.run?.name || 'Workflow';
    document.title = `Workflow: ${name}`;
    $('#title').textContent = `Workflow: ${name}`;
    hideTip();
    const main = $('#main');
    const y = window.scrollY;
    CH = changeMap();
    where = new Map();
    rows = new Map();
    labels = new Map();
    main.replaceChildren(...howMade().filter(Boolean), ...filters());

    const goal = wf.tree || {};
    main.append(h('section', {},
      h('h2', {}, 'What it is for'),
      h('div', { class: 'goal' },
        h('dl', { class: 'about' },
          aboutRow('Title', 'title', 'The interface’s name'),
          aboutRow('For', 'what_it_is_for', 'One sentence'),
          aboutRow('Field', 'field', 'The science it serves'),
          aboutRow('Stage of the work', 'stage_of_work', 'Where in the work it is used'),
          wf.data?.note ? [h('dt', {}, 'Data'), h('dd', {}, `${wf.data.source || ''}${wf.data.source ? ': ' : ''}${wf.data.note}`)] : null),
        nodeRow(goal, 'Goal', null, null).row)));

    goal.children ||= [];
    const phases = peers(goal);
    main.append(h('section', {},
      h('h2', {}, 'The workflow'),
      h('p', { class: 'how' }, 'Phases, and the tasks inside them, in the order a person meets them. Open a phase to see its tasks, and the features each task uses; point at a feature to see it, click it to go to it.'),
      phases.length ? phases.map((p, i) => part(p, String(i + 1), goal.children, goal)) : h('p', { class: 'empty' }, 'There are no phases yet.'),
      h('div', { class: 'adds' }, h('button', { type: 'button', class: 'asta-button asta-button-default-outlined asta-button-size-sm',
        onclick: () => addPart(goal.children, 'phase') }, 'Add a phase'))));

    const gaps = [...(wf.not_done || []), ...(wf.screens_never_reached || [])];
    if (gaps.length) {
      main.append(h('section', {},
        h('h2', {}, 'Not reached'),
        h('p', { class: 'how' }, 'What the derivation saw named or started but could not reach, and why.'),
        h('div', { class: 'list' }, gaps.map((g) => h('p', {}, g)))));
    }

    const feats = (wf.features ||= []);
    const allFeatOpen = feats.length && feats.every((f) => openFeat.has(f.id));
    main.append(h('section', { id: 'features' },
      h('div', { class: 'sec-head' }, h('h2', {}, 'Features'), h('span', { class: 'gap' }),
        feats.length ? h('button', { type: 'button', class: 'asta-button asta-button-default-outlined asta-button-size-sm',
          onclick: () => { openFeat = allFeatOpen ? new Set() : new Set(feats.map((f) => f.id)); keepOpen(); render(); } },
        allFeatOpen ? 'Fold every feature' : 'Open every feature') : null),
      h('p', { class: 'how' }, 'A feature is a component with the few steps a person takes with it, which someone could reuse in their own tool. Open one to see what it does and the tasks it serves.'),
      h('div', { class: 'list' }, feats.length ? feats.map((f) => featRow(f, feats)) : h('p', { class: 'empty' }, 'There are no features yet.')),
      h('div', { class: 'adds' }, h('button', { type: 'button', class: 'asta-button asta-button-default-outlined asta-button-size-sm',
        onclick: () => addPart(feats, 'feature') }, 'Add a feature'))));

    main.append(surveySection(), intendedSection());
    main.append(h('p', { class: 'where' }, 'Saved on this computer as ', h('code', {}, data.files.json), ' and, as an outline, ',
      h('code', {}, data.files.md), '.'));
    window.scrollTo(0, y);
    count();
    summary(CH);
  }

  // -- saving ------------------------------------------------------------------------------------
  // Parts left with no words are not saved, so an Add that was never typed in leaves nothing.
  function clean(obj) {
    const copy = JSON.parse(JSON.stringify(obj));
    const keep = (n) => (n.kind === 'action' ? (n.label || '').trim() : (n.general || '').trim());
    const walk = (n) => { n.children = (n.children || []).filter(keep); n.children.forEach(walk); };
    if (copy.tree) walk(copy.tree);
    copy.features = (copy.features || []).filter((f) => (f.name || '').trim());
    if (copy.survey && !Object.keys(copy.survey).length) delete copy.survey;
    return copy;
  }

  let saving = Promise.resolve(), waiting = null;
  function save(now = false, said = '') {
    clearTimeout(saveTimer);
    $('#saved').textContent = 'Not saved yet';
    $('#saved').classList.remove('bad');
    waiting = () => {
      waiting = null;
      saving = saving.then(() => fetch('workflow', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(clean(wf)) })
        .then((r) => r.json())
        .then((r) => {
          if (!r.ok) throw new Error(r.error || 'not saved');
          const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          $('#saved').replaceChildren(said ? `${said} Saved ${t}.` : `Saved ${t}`);
          if (said && removed) {
            $('#saved').append(h('button', { type: 'button', onclick: () => {
              const { n, list, at } = removed;
              removed = null;
              list.splice(at, 0, n);
              render();
              save(true);
            } }, 'Undo'));
          }
        })
        .catch((e) => { $('#saved').textContent = `Not saved: ${e.message}. Is astaui derive show still running?`; $('#saved').classList.add('bad'); }));
      return saving;
    };
    saveTimer = setTimeout(() => waiting && waiting(), now ? 0 : 400);
  }
  // Whatever is still waiting to save, saved now.
  const flush = () => { clearTimeout(saveTimer); return waiting ? waiting() : saving; };

  // -- sending it: a confirmation that says what goes, then Cancel or Send -------------------------
  const when = (iso) => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  function sendState() {
    const s = data.send || {};
    const b = $('#send');
    b.hidden = !s.ready;
    b.textContent = s.sent ? 'Send again' : 'Send to the AstaUI team';
    b.title = s.sent ? `Sent ${when(s.sent.at)}. Sending again replaces that copy with this one.` : 'Send the workflow with your ratings, changes and survey answers';
  }
  function openSend() {
    const t = tallies();
    const k = changeCounts();
    const edits = k.reworded + k.moved + k.added;
    const answered = SURVEY.filter(([key]) => Number.isInteger(wf.survey?.[key])).length;
    const wrote = !!(wf.intended_workflow || '').trim();
    const shots = data.send?.screens || 0;
    const lines = [
      t.rated ? `Your ratings of ${t.rated} of ${t.all} parts: ${t.right} right, ${t.wrong} needing a fix, ${t.out} not belonging, with your notes`
        : `Every part, not rated yet (${t.all} parts)`,
      edits ? `Your changes, each with its before and after: ${[k.reworded && `${k.reworded} reworded`, k.moved && `${k.moved} moved`, k.added && `${k.added} added`].filter(Boolean).join(', ')}`
        : 'No changes to the words or the order',
      `Your survey answers: ${answered} of ${SURVEY.length}`,
      wrote ? 'The workflow you described in your own words' : 'No description of the workflow you intended',
      shots ? `Up to ${shots} screenshot${shots === 1 ? '' : 's'} the agent took of the app` : null,
      'None of the app’s code',
    ].filter(Boolean);
    $('#send-list').replaceChildren(...lines.map((l) => h('li', {}, l)));
    const missing = [];
    if (!t.rated) missing.push('rated any parts');
    if (answered < SURVEY.length) missing.push(answered ? 'answered every survey question' : 'answered the survey');
    if (!wrote) missing.push('described the workflow you intended');
    const warn = $('#send-warn');
    warn.hidden = !missing.length;
    warn.textContent = missing.length ? `You have not ${missing.join(', or ')} yet. You can send now and send again later; the newer copy replaces this one.` : '';
    if (data.send?.sent) $('#send-list').append(h('li', {}, `You sent it ${when(data.send.sent.at)}; this copy replaces that one`));
    $('#send-name').value = data.send?.name || '';
    $('#send-said').textContent = '';
    $('#send-said').classList.remove('bad');
    $('#send-go').disabled = false;
    $('#sendbox').showModal();
    $('#send-no').focus();
  }
  $('#send').addEventListener('click', openSend);
  $('#send-no').addEventListener('click', () => $('#sendbox').close());
  $('#send-go').addEventListener('click', async () => {
    const go = $('#send-go');
    go.disabled = true;
    $('#send-said').textContent = 'Sending…';
    await flush();
    const r = await fetch('send', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('#send-name').value }) }).then((x) => x.json()).catch((e) => ({ ok: false, error: e.message }));
    if (!r.ok) {
      $('#send-said').textContent = `Not sent: ${r.error || 'no answer'}`;
      $('#send-said').classList.add('bad');
      go.disabled = false;
      return;
    }
    data.send = { ...(data.send || {}), sent: r.sent, name: $('#send-name').value };
    sendState();
    $('#sendbox').close();
    $('#saved').textContent = `Sent to the AstaUI team ${when(r.sent.at)}.`;
  });

  fetch('data').then((r) => r.json()).then((d) => {
    data = d;
    wf = d.workflow || {};
    try {
      open = new Set(JSON.parse(localStorage.getItem(key('open')) || '[]'));
      openFeat = new Set(JSON.parse(localStorage.getItem(key('feat-open')) || '[]'));
    } catch (e) { open = new Set(); openFeat = new Set(); }
    sendState();
    render();
    $('#saved').textContent = wf.saved ? `Saved ${new Date(wf.saved).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : '';
  }).catch((e) => {
    $('#main').replaceChildren(h('p', { class: 'lede err' }, `The workflow did not load (${e.message}). Start the page with astaui derive show.`));
  });
})();
</script>
</body>
</html>
