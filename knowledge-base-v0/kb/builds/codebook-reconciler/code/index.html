<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconcile codes: caregiver interviews</title>
<style>
  /* ---------- Base ---------- */
  :root {
    --bg: #f5f5f3; --panel: #fff; --line: #d9d9d4; --soft-line: #ecece8;
    --ink: #1f2328; --muted: #6b6f76; --accent: #2f6f6a; --accent-soft: #e5f0ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button:hover { border-color: #b8b8b1; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  h3 { font-size: 14px; margin: 18px 0 8px; }
  .muted { color: var(--muted); }

  /* ---------- Header and agreement summary ---------- */
  header { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 13px; }
  #summary { display: flex; gap: 28px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .stat b { font-size: 18px; font-weight: 600; margin-right: 4px; }
  .progress { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .bar { width: 180px; height: 6px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: #f0f0ec; }
  .bar span { display: block; height: 100%; background: var(--accent); }

  /* ---------- Layout ---------- */
  main { display: grid; grid-template-columns: 400px 1fr; height: calc(100vh - 100px); }
  #left { overflow-y: auto; border-right: 1px solid var(--line); padding: 14px 16px; }
  #detail { overflow-y: auto; padding: 16px 24px 48px; max-width: 920px; }

  /* ---------- Per-code agreement table ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 6px; }
  th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--soft-line); font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f0f0ec; }
  tbody tr.on { background: var(--accent-soft); }
  td .lvl { display: block; font-size: 11px; color: var(--muted); }
  td.low { font-weight: 600; }

  /* ---------- Disagreement queue ---------- */
  #queue { list-style: none; margin: 0; padding: 0; }
  #queue li { border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px; margin-bottom: 6px; cursor: pointer; background: var(--panel); font-size: 13px; }
  #queue li.current { border-color: var(--accent); background: var(--accent-soft); }
  #queue li.done { color: var(--muted); }
  .q-top { display: flex; justify-content: space-between; }
  .q-state { font-size: 12px; }
  .filter-note { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }

  /* ---------- Disagreement detail: A vs B ---------- */
  .d-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .d-head .spacer { flex: 1; }
  .excerpt { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; font-size: 15px; line-height: 1.6; margin: 0 0 14px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
  .side.chosen { border-color: var(--accent); background: var(--accent-soft); }
  .side .who { font-size: 12px; color: var(--muted); }
  .side .code-name { font-weight: 600; margin: 2px 0 4px; }
  .side p { margin: 0 0 10px; font-size: 13px; color: #3c4047; }
  .other { display: flex; gap: 8px; align-items: center; margin: 12px 0 8px; }
  .other select { border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; background: #fff; }
  label.small { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 2px; }
  #note { width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; background: #fff; }
  .resolution { margin: 10px 0 0; }

  /* ---------- Definition editor and change log ---------- */
  .def-edit { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-bottom: 10px; }
  .def-edit textarea { width: 100%; height: 70px; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; resize: vertical; }
  .def-edit .orig { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .def-edit .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  #changes { padding-left: 18px; font-size: 13px; }
  #changes li { margin-bottom: 6px; }
  .keys { font-size: 12px; color: var(--muted); margin-top: 20px; }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font: 12px ui-monospace, Menlo, Consolas, monospace; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>Caregiver interviews: reconcile coder A and coder B</h1>
  <div class="spacer"></div>
  <span id="status"></span>
  <button id="export-csv" class="primary">Export final codes (CSV)</button>
  <button id="export-json">Export codebook (JSON)</button>
</header>
<div id="summary"></div>
<main>
  <div id="left">
    <h2>Agreement by code</h2>
    <table id="kappa-table">
      <thead><tr><th>Code</th><th>A</th><th>B</th><th>Both</th><th>Cohen's &kappa;</th><th>Disagree</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="muted" style="font-size:12px;margin:0 0 18px">Per-code &kappa; treats each code as present or absent. Click a code to see only its disagreements.</p>
    <h2>Disagreements</h2>
    <div id="filter-note"></div>
    <ul id="queue"></ul>
  </div>
  <div id="detail"></div>
</main>

<script>
// ===================== Data: codebook and both coders' codes (synthetic) =====================
const CODES = [
  { id: 'COORD', name: 'Coordination burden', def: 'Work of keeping family members and paid carers aligned on schedules, tasks and who is responsible.' },
  { id: 'AUTON', name: 'Care recipient autonomy', def: "Talk about preserving the person's independence, choice or dignity in daily life." },
  { id: 'SURV', name: 'Surveillance concern', def: 'Unease about monitoring the person (location, cameras, activity sensors), including guilt about tracking.' },
  { id: 'BREAK', name: 'Technology breakdown', def: 'A device or app failed, was misconfigured, or was abandoned because it did not work.' },
  { id: 'EMOT', name: 'Emotional labour', def: "Managing the caregiver's own or the person's feelings: reassurance, guilt, frustration." },
  { id: 'WORK', name: 'Workaround', def: 'An improvised practice that bends or replaces a tool to fit the care situation.' },
  { id: 'INFO', name: 'Information sharing', def: "Passing updates about the person's health or day to others in the care network." }
];
// [excerpt id, participant, coder A's code, coder B's code, text]
const SEGMENTS = [
  ['S01', 'P01', 'COORD', 'COORD', 'My brother lives two hours away, so every Sunday I put the week into the shared calendar: who drives Mum to the clinic, who does the pharmacy run.'],
  ['S02', 'P01', 'AUTON', 'AUTON', "She still wants to choose her own clothes, so the reminder just says 'getting dressed' and leaves the rest to her."],
  ['S03', 'P01', 'SURV', 'SURV', "We turned on location sharing after she walked to the old house. I check it more than I'd like to admit."],
  ['S04', 'P01', 'WORK', 'BREAK', 'The pill dispenser beeps, but she worked out how to turn the sound off within a week.'],
  ['S05', 'P02', 'WORK', 'WORK', 'I write the appointments on the whiteboard in the kitchen and also in the app, because Dad only looks at the whiteboard.'],
  ['S06', 'P02', 'INFO', 'INFO', 'When the hospital changed his tablets, I sent a photo of the new box to the family group so nobody gave him the old ones.'],
  ['S07', 'P02', 'SURV', 'AUTON', "He doesn't know the watch tells me where he is. I tell myself it's for his safety, but it's not a conversation we've had."],
  ['S08', 'P02', 'EMOT', 'EMOT', 'Some evenings I sit in the car outside his flat for ten minutes before going in, just to get my face right.'],
  ['S09', 'P03', 'BREAK', 'BREAK', 'The app sent reminders in American date format and Mum thought her appointment was in December.'],
  ['S10', 'P03', 'COORD', 'EMOT', 'My sister and I argue about who forgot to update the calendar. It was supposed to stop that, and now it is the thing we fight about.'],
  ['S11', 'P03', 'AUTON', 'SURV', "She asked me to take the camera out of the living room. She said, 'I'm not a baby.' So we moved it to the hallway."],
  ['S12', 'P03', 'WORK', 'WORK', 'I keep a paper list in my wallet of every medication and dose, in case the phone dies at the GP.'],
  ['S13', 'P04', 'INFO', 'WORK', 'The carers write in the folder by the door and I photograph the page each evening and put it in our chat.'],
  ['S14', 'P04', 'BREAK', 'BREAK', 'We tried a video doorbell so he could see who was there, but the delay confused him and he stopped answering the door at all.'],
  ['S15', 'P04', 'AUTON', 'AUTON', "He likes pressing the big button to call me. It's the one thing on the tablet he does by himself, and he's proud of it."],
  ['S16', 'P04', 'COORD', 'COORD', "I'm the only one who knows all the passwords. If I'm ill, nobody can get into anything."],
  ['S17', 'P05', 'SURV', 'SURV', "I don't read her messages, but I can see when she was last online, and if it's more than a day I ring."],
  ['S18', 'P05', 'AUTON', 'SURV', "She wants to keep going to the shops alone. We agreed she'd share her location just for that walk, and she turns it on herself."],
  ['S19', 'P05', 'EMOT', 'EMOT', "It's the guilt, mostly. Every reminder I set feels like admitting she can't remember."],
  ['S20', 'P05', 'BREAK', 'COORD', 'Her GP surgery uses one portal, the hospital uses another, and neither talks to the calendar.'],
  ['S21', 'P06', 'COORD', 'COORD', 'We have a rota in a spreadsheet, a colour for each person, and the paid carer can see it.'],
  ['S22', 'P06', 'WORK', 'WORK', 'I recorded the reminders in my own voice because he ignored the robot voice.'],
  ['S23', 'P06', 'INFO', 'INFO', 'My daughter posts a little summary in the family chat after she visits: what he ate, his mood, whether he took his tablets.'],
  ['S24', 'P06', 'EMOT', 'EMOT', "When he gets upset about the alarms I just sit with him. The technology can't do that bit."],
  ['S25', 'P06', 'SURV', 'EMOT', "The motion sensor tells me he's up at 3am most nights. I don't know what to do with that except worry."],
  ['S26', 'P07', 'AUTON', 'AUTON', "Mum decides when she wants a call. We put a 'call me' button on her phone instead of ringing on a schedule."],
  ['S27', 'P07', 'BREAK', 'BREAK', 'The tracker battery lasts two days. Twice it was dead exactly when we needed it.'],
  ['S28', 'P07', 'WORK', 'INFO', 'I copy every text from the care agency into a note on my phone, because they change rota numbers every month.'],
  ['S29', 'P07', 'COORD', 'COORD', "Three of us are on the calendar but really it's me doing everything, the others just get notified."],
  ['S30', 'P07', 'AUTON', 'AUTON', "I don't want her to feel watched. I'd rather find out late that she fell than have her live like a prisoner."],
  ['S31', 'P08', 'SURV', 'AUTON', 'We had a family meeting about the camera and voted. Dad voted no, and we put it in anyway.'],
  ['S32', 'P08', 'INFO', 'COORD', 'The app sends my brother a notification when Dad misses a dose, and he phones me, not Dad.'],
  ['S33', 'P08', 'EMOT', 'EMOT', 'I cried in the car park after the memory clinic and then had to go and update everyone.'],
  ['S34', 'P08', 'WORK', 'WORK', "We stuck tape over the TV remote buttons he doesn't need. It's low-tech but it worked."],
  ['S35', 'P08', 'EMOT', 'EMOT', "The smart speaker answers him when he asks the date, which he does maybe forty times a day. It's patient in a way I can't be."],
  ['S36', 'P03', 'INFO', 'INFO', 'I send the carer a voice note before her shift with anything that happened overnight.'],
  ['S37', 'P05', 'BREAK', 'BREAK', "The shared calendar deleted a week of entries after an update. We didn't notice until she missed the dentist."],
  ['S38', 'P01', 'SURV', 'AUTON', "I agreed with Mum that I'd only look at her location if she hadn't answered two calls."],
  ['S39', 'P04', 'COORD', 'COORD', 'Whoever visits ticks the box on the shared list so the next person knows the bins are done.'],
  ['S40', 'P02', 'AUTON', 'AUTON', 'He asked me to show him how to turn the tracker off. I showed him. That felt important.']
].map(([id, pid, a, b, text]) => ({ id, pid, a, b, text }));
const DISAGREE = SEGMENTS.filter(s => s.a !== s.b);

// ===================== State and saving =====================
const STORE_KEY = 'codebook-reconciler/caregivers/v1';
const saved = (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; } })();
const state = Object.assign({ resolved: {}, notes: {}, defs: {}, changes: [] }, saved || {});
let filterCode = null;
let currentId = DISAGREE[0].id;
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

// ===================== Helpers =====================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const code = id => CODES.find(c => c.id === id);
const defOf = id => state.defs[id] ?? code(id).def;
const fmt = k => k == null ? 'n/a' : k.toFixed(2);
function setStatus(msg) { $('status').textContent = msg; }
function finalCode(s) { return s.a === s.b ? s.a : (state.resolved[s.id] || ''); }

// ===================== Agreement: Cohen's kappa =====================
// Overall: one code per excerpt, so kappa over all seven categories.
function overallAgreement() {
  const n = SEGMENTS.length;
  const agree = SEGMENTS.filter(s => s.a === s.b).length;
  const po = agree / n;
  const pe = CODES.reduce((sum, c) =>
    sum + (SEGMENTS.filter(s => s.a === c.id).length / n) * (SEGMENTS.filter(s => s.b === c.id).length / n), 0);
  return { n, agree, po, kappa: (po - pe) / (1 - pe) };
}
// Per code: each excerpt either has the code or not, for each coder (2 x 2 table).
function codeAgreement(c) {
  let both = 0, onlyA = 0, onlyB = 0, neither = 0;
  SEGMENTS.forEach(s => {
    const x = s.a === c.id, y = s.b === c.id;
    if (x && y) both++; else if (x) onlyA++; else if (y) onlyB++; else neither++;
  });
  const n = SEGMENTS.length, po = (both + neither) / n;
  const pA = (both + onlyA) / n, pB = (both + onlyB) / n;
  const pe = pA * pB + (1 - pA) * (1 - pB);
  return { code: c.id, a: both + onlyA, b: both + onlyB, both, disagree: onlyA + onlyB, kappa: pe === 1 ? null : (po - pe) / (1 - pe) };
}
// Landis and Koch (1977) bands.
function band(k) {
  if (k == null) return '';
  if (k < 0) return 'poor';
  if (k <= .2) return 'slight';
  if (k <= .4) return 'fair';
  if (k <= .6) return 'moderate';
  if (k <= .8) return 'substantial';
  return 'almost perfect';
}

// ===================== Summary bar and progress =====================
function renderSummary() {
  const o = overallAgreement();
  const done = DISAGREE.filter(s => state.resolved[s.id]).length;
  $('summary').innerHTML = `
    <span class="stat"><b>${o.n}</b>excerpts coded by both</span>
    <span class="stat"><b>${Math.round(o.po * 100)}%</b>agreement (${o.agree} of ${o.n})</span>
    <span class="stat"><b>${fmt(o.kappa)}</b>Cohen's &kappa;, ${band(o.kappa)}</span>
    <span class="progress"><span>Resolved ${done} of ${DISAGREE.length} disagreements</span>
      <span class="bar"><span style="width:${(done / DISAGREE.length) * 100}%"></span></span></span>`;
}

// ===================== Per-code agreement table =====================
function renderTable() {
  $('kappa-table').querySelector('tbody').innerHTML = CODES.map(c => {
    const r = codeAgreement(c);
    return `<tr data-code="${c.id}" class="${filterCode === c.id ? 'on' : ''}" title="Show only disagreements involving ${esc(c.name)}">
      <td>${esc(c.name)}</td><td>${r.a}</td><td>${r.b}</td><td>${r.both}</td>
      <td class="${r.kappa != null && r.kappa < .6 ? 'low' : ''}">${fmt(r.kappa)}<span class="lvl">${band(r.kappa)}</span></td>
      <td>${r.disagree}</td></tr>`;
  }).join('');
}
$('kappa-table').addEventListener('click', e => {
  const tr = e.target.closest('tbody tr'); if (!tr) return;
  filterCode = filterCode === tr.dataset.code ? null : tr.dataset.code;
  const q = queue();
  if (q.length && !q.some(s => s.id === currentId)) currentId = (q.find(s => !state.resolved[s.id]) || q[0]).id;
  renderAll();
});

// ===================== Disagreement queue =====================
function queue() { return filterCode ? DISAGREE.filter(s => s.a === filterCode || s.b === filterCode) : DISAGREE; }
function renderQueue() {
  const q = queue();
  $('filter-note').innerHTML = filterCode
    ? `<div class="filter-note"><span>Involving ${esc(code(filterCode).name)}: ${q.filter(s => state.resolved[s.id]).length} of ${q.length} resolved</span><button id="clear-filter">Show all</button></div>`
    : '';
  if (filterCode) $('clear-filter').onclick = () => { filterCode = null; renderAll(); };
  $('queue').innerHTML = q.map(s => {
    const r = state.resolved[s.id];
    return `<li data-id="${s.id}" class="${s.id === currentId ? 'current' : ''} ${r ? 'done' : ''}">
      <div class="q-top"><b>${s.id} &middot; ${s.pid}</b><span class="q-state">${r ? 'Resolved: ' + esc(code(r).name) : 'Open'}</span></div>
      <div>A: ${esc(code(s.a).name)} &middot; B: ${esc(code(s.b).name)}</div></li>`;
  }).join('');
}
$('queue').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  currentId = li.dataset.id; renderAll();
});

// ===================== Disagreement detail: A vs B, resolve =====================
function renderDetail() {
  const q = queue();
  const s = SEGMENTS.find(x => x.id === currentId);
  const pos = q.indexOf(s);
  const r = state.resolved[s.id];
  const side = (who, id) => `
    <div class="side ${r === id ? 'chosen' : ''}">
      <div class="who">Coder ${who}</div>
      <div class="code-name">${esc(code(id).name)}</div>
      <p>${esc(defOf(id))}</p>
      <button data-pick="${id}">Use ${who}'s code <kbd>${who === 'A' ? 1 : 2}</kbd></button>
    </div>`;
  const others = CODES.filter(c => c.id !== s.a && c.id !== s.b);
  $('detail').innerHTML = `
    <div class="d-head"><b>${s.id}</b><span class="muted">${s.pid}${pos >= 0 ? ` &middot; ${pos + 1} of ${q.length} in queue` : ''}</span>
      <span class="spacer"></span>
      <button id="prev">Previous <kbd>k</kbd></button><button id="next">Next <kbd>j</kbd></button></div>
    <p class="excerpt">${esc(s.text)}</p>
    <div class="pair">${side('A', s.a)}${side('B', s.b)}</div>
    <div class="other"><span class="muted">Or another code</span>
      <select id="other">${others.map(c => `<option value="${c.id}" ${r === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <button id="use-other">Use this code</button></div>
    <label class="small" for="note">Why (for the memo)</label>
    <input id="note" value="${esc(state.notes[s.id] || '')}" placeholder="e.g. tracking agreed with her, so it is about autonomy">
    <p class="resolution">${r ? `Resolved as <b>${esc(code(r).name)}</b>. <button id="undo">Reopen</button>` : '<span class="muted">Not resolved yet.</span>'}</p>
    <h3>Definitions in question</h3>
    ${[s.a, s.b].map(defEditor).join('')}
    <h3>Codebook changes</h3>
    ${state.changes.length ? `<ol id="changes">${state.changes.map(changeItem).join('')}</ol>` : '<p class="muted">No definitions edited yet.</p>'}
    <p class="keys"><kbd>j</kbd> next &nbsp; <kbd>k</kbd> previous &nbsp; <kbd>1</kbd> use A's code &nbsp; <kbd>2</kbd> use B's code</p>`;

  $('detail').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => resolve(b.dataset.pick));
  $('use-other').onclick = () => resolve($('other').value);
  $('note').oninput = e => { state.notes[s.id] = e.target.value; save(); };
  $('prev').onclick = () => step(-1);
  $('next').onclick = () => step(1);
  if (r) $('undo').onclick = () => { delete state.resolved[s.id]; save(); renderAll(); setStatus(`${s.id} reopened`); };
  $('detail').querySelectorAll('[data-save-def]').forEach(b => b.onclick = () => saveDefinition(b.dataset.saveDef, s.id));
}

function resolve(codeId) {
  state.resolved[currentId] = codeId; save();
  setStatus(`${currentId} resolved as ${code(codeId).name}`);
  const q = queue(), i = q.findIndex(s => s.id === currentId);
  const nextOpen = [...q.slice(i + 1), ...q.slice(0, i)].find(s => !state.resolved[s.id]);
  if (nextOpen) currentId = nextOpen.id;
  renderAll();
}
function step(d) {
  const q = queue(); if (!q.length) return;
  const i = q.findIndex(s => s.id === currentId);
  currentId = q[Math.min(q.length - 1, Math.max(0, i + d))].id;
  renderAll();
}

// ===================== Definition editor and change log =====================
function defEditor(id) {
  const c = code(id), changed = defOf(id) !== c.def;
  return `<div class="def-edit"><b>${esc(c.name)}</b>
    <textarea id="def-${id}">${esc(defOf(id))}</textarea>
    ${changed ? `<p class="orig">Original: ${esc(c.def)}</p>` : ''}
    <div class="row"><span class="muted" style="font-size:12px">${changed ? 'Edited' : 'Original wording'}</span>
      <button data-save-def="${id}">Save definition</button></div></div>`;
}
function saveDefinition(id, segId) {
  const next = $(`def-${id}`).value.trim(), prev = defOf(id);
  if (!next || next === prev) { setStatus('Definition unchanged'); return; }
  state.defs[id] = next;
  state.changes.push({ code: id, from: prev, to: next, during: segId, at: new Date().toISOString() });
  save(); renderAll(); setStatus(`Saved new definition for ${code(id).name}`);
}
function changeItem(ch) {
  return `<li><b>${esc(code(ch.code).name)}</b>, while discussing ${ch.during}<br>
    <span class="muted">Was:</span> ${esc(ch.from)}<br><span class="muted">Now:</span> ${esc(ch.to)}</li>`;
}

// ===================== Keyboard =====================
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  const s = SEGMENTS.find(x => x.id === currentId);
  if (e.key === 'j') step(1);
  else if (e.key === 'k') step(-1);
  else if (e.key === '1') resolve(s.a);
  else if (e.key === '2') resolve(s.b);
});

// ===================== Export: final codes (CSV) and codebook (JSON) =====================
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
const csvCell = v => { const t = String(v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
$('export-csv').onclick = () => {
  const rows = [['excerpt', 'participant', 'coder_a', 'coder_b', 'agreed', 'final_code', 'resolution_note', 'text']];
  SEGMENTS.forEach(s => {
    const f = finalCode(s);
    rows.push([s.id, s.pid, code(s.a).name, code(s.b).name, s.a === s.b ? 'yes' : 'no', f ? code(f).name : '', state.notes[s.id] || '', s.text]);
  });
  download('final-codes.csv', rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv');
  const open = DISAGREE.filter(s => !state.resolved[s.id]).length;
  setStatus(open ? `Exported. ${open} disagreements are still open; their final_code is blank.` : 'Exported final codes for all excerpts');
};
$('export-json').onclick = () => {
  const o = overallAgreement();
  const out = {
    exported: new Date().toISOString(),
    agreement: {
      excerpts: o.n, agreed: o.agree, percent_agreement: +(o.po * 100).toFixed(1), cohens_kappa: +o.kappa.toFixed(3),
      per_code: CODES.map(c => { const r = codeAgreement(c); return { code: c.name, coder_a: r.a, coder_b: r.b, both: r.both, cohens_kappa: r.kappa == null ? null : +r.kappa.toFixed(3) }; })
    },
    codebook: CODES.map(c => ({ id: c.id, name: c.name, definition: defOf(c.id), original_definition: c.def, edited: defOf(c.id) !== c.def })),
    changes: state.changes.map(ch => ({ ...ch, code: code(ch.code).name }))
  };
  download('codebook-reconciled.json', JSON.stringify(out, null, 2), 'application/json');
  setStatus('Exported codebook and agreement');
};

// ===================== Start =====================
function renderAll() { renderSummary(); renderTable(); renderQueue(); renderDetail(); }
renderAll();
</script>
