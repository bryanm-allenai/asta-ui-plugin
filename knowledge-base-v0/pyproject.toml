[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astaui"
version = "0.1.0"
description = "A knowledge base of the interfaces scientists build: file them, describe them as cards, find them by structure."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Bryan Min" }]
dependencies = []

[project.optional-dependencies]
api = ["anthropic"]
vertex = ["anthropic[vertex]"]
local = ["sentence-transformers"]
map = ["numpy", "umap-learn"]

[project.scripts]
astaui = "astaui.cli:main"

[tool.setuptools]
packages = ["astaui"]

[tool.setuptools.package-data]
astaui = ["*.html", "*.js", "*.css", "*.svg"]
